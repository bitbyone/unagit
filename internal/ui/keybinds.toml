hidden_repositories = "X"

# Filter: Narrow the list by typing.
filter = "/"

# Go to Repositories: Every repository of the servers and groups you picked.
go_to_repositories = "1"

# Go to Merge Requests: The open merge requests of those repositories.
go_to_merge_requests = "2"

# Go to Worktrees: Every worktree on disk, plain and grouped.
go_to_worktrees = "3"

# Go to Activity: What runs in the background and waits for you.
go_to_activity = "4"

# Go to Sandboxes: unibox's sandboxes, the tasks agents work on in them, the
