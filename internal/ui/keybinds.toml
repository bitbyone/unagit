go_to_sandboxes = "5"

# Go to Settings: Servers, groups, tags, integrations and security.
go_to_settings = "S"

# Help: Every key of every screen, the ones that work here lit.
help = "?"

# Quit: Leave unagit. Window editors it opened stay open.
quit = "q"

# New Grouped Worktree…: Make one folder holding a worktree of each marked
