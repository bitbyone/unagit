# The keys of unagit's actions as they are when keybinds.toml changes none
# of them; unagit keys prints this, and Settings > Keys writes it into
# keybinds.toml with every binding commented out.
#
# This file is written by the tests: go test ./internal/ui -run
# TestTheKeybindsReferenceIsCurrent -args -update-keybinds

# Everywhere: the two action pickers, and what can be done from any screen. A
#   section below that names the same action wins over this one on its screen.
[global]

# Actions of the Selection…: Every action on what is selected, with its key.
actions = ["alt+enter", "ctrl+a"]

# Actions of the Screen…: Every action of the screen, with its key.
screen_actions = ":"

# Running Editors…: Return to a Neovim left aside.
running_editors = "E"

# Running Agents…: Go to a coding agent at work, the ones waiting for an
#   answer first.
running_agents = []

# New Sandbox Task…: Start an agent on a new task in a sandbox.
new_sandbox_task = "ctrl+s"

# Find Repository…: Every repository your accounts are members of, in groups
#   you did not choose and hidden ones too.
find_repository = "+"

# Watches…: Everything watched in one list, from any screen.
watches = "W"

# Switch Theme…: Put another theme on, everywhere at once.
switch_theme = []

# Redraw Screen: Send the whole screen to the terminal again, when it shows
#   remains of what was there before.
redraw_screen = []

# Repositories (1): the repository under the cursor, the marked ones, and the
#   list.
[repositories]

# Finish New Repository…: Finish a repository made from a local folder.
finish_new_repository = []

# Browse Files: Browse in Yazi; choose a file to open it in your default
#   editor.
browse_files = []

# Open: Open the clone in your default editor, here, cloning it first when it
#   is not on disk.
open = "ctrl+o"

# Open…: Choose with what - an editor or an agent - and where it opens, the
#   form filled in as you last used it here.
open_in = "O"

# Open With…: Choose the editor, then open the clone here.
open_with = "alt+o"

# New Worktree…: Check a branch out in a directory of its own beside the
#   clone, an existing branch or a new one.
new_worktree = "ctrl+w"

# Pull: Fetch origin and fast-forward the clone's branch when nothing local is
#   in the way.
pull = "p"

# Commit…: Commit the clone's changes to versioned files with a message you
#   write, and push them with it if you like.
commit = "c"

# Changes…: The files not committed and their diffs.
changes = "ctrl+k"

# Push: Push the clone's branch to origin once it has commits origin lacks.
push = "P"

# Move Changes to New Worktree…: Take what is not committed in the clone,
#   unversioned files too, to a new branch in a worktree of its own at the
#   same commit.
move_changes_to_new_worktree = []

# New Merge Request…: Open a merge request on the server from the branch the
#   clone has out, pushing it first when origin lacks some of it.
new_merge_request = "n"

# Show Merge Requests: Switch to Merge requests, narrowed to this repository.
show_merge_requests = "m"

# Open in Browser: Open the repository's page on the server.
open_in_browser = "w"

# Branches…: Switch the clone to another branch, see where each stands
#   against origin, delete those you are done with.
branches = "b"

# Refresh: Fetch this clone from origin, read its branch's pipeline and see
#   where it stands, leaving the rest of the list as it is.
refresh = "r"

# Hide Merge Requests: Keep the repository's merge requests out of the list
#   and out of refreshes, the repository still here.
hide_merge_requests = "H"

# Show Commit Log: What is out in the clone, newest first.
show_commit_log = "ctrl+l"

# Show Pipeline…: The jobs of the newest pipeline of the clone's branch.
show_pipeline = "J"

# Watch Branch: Follow it in the background.
toggle_watch = []

# Back to Branch: Leave the commit checked out from the log and check out
#   again the branch it came from.
back_to_branch = "B"

# Clone: Clone it under its root without starting an editor.
clone = "C"

# Copy…: Copy the web link, the path, the branch or the directory to the
#   clipboard.
copy = "y"

# Show Uncommitted Changes: Show in Hunk what is not committed.
show_uncommitted_changes = "D"

# Recover from Reflog…: Every place the clone's branch has been, whatever
#   moved it.
recover_from_reflog = []

# Shelve Changes…: Put what is not committed in the clone aside under a
#   name, unversioned files too, the files back as the last commit has them.
shelve_changes = []

# Shelf…: The changes put aside in this repository.
shelf = []

# Rewrite History…: Every squash, rebase, edited message, undone commit and
#   deleted branch of the repository, in order.
rewrite_history = []

# Set Base…: Choose the branch the clone's branch was made from, which the
#   diffs since base go by.
set_base = []

# Show Changes Since Base: The branch's commits since its base and what is not
#   committed, in Hunk.
show_changes_since_base = "alt+d"

# Toggle Favourite: Star it, so it can be kept at the top.
toggle_favourite = "ctrl+f"

# Edit Tags…: Put your tags on this repository or take them off.
edit_tags = "ctrl+t"

# Set Clone Directory…: Choose the exact directory this repository is cloned
#   into, instead of its group's root.
set_clone_directory = "e"

# Hide or Unhide: Take this repository out of the lists.
hide_or_unhide = "x"

# Delete from Disk…: Delete the clone or one of its worktrees from disk.
delete_from_disk = "d"

# Unibox Init…: Set unibox up from this repository, your team's sbxenv
#   files.
unibox_init = []

# Open in Sandbox…: Start an agent on it in a unibox sandbox.
open_in_sandbox = []

# Add to Unibox Index…: Name it in Unibox's index of repositories, for one
#   env's tasks or every env's, so a task is given it by name.
add_to_unibox_index = []

# Running Agents…: Go to a coding agent at work, the ones waiting for an
#   answer first.
running_agents = "alt+a"

# Refresh All: Ask the servers for the repositories again, and the pipelines
#   of the clones' branches.
refresh_all = "R"

# New Repository…: Create a repository on a server and clone it.
new_repository = []

# New Repository from Folder…: Create a repository on a server from a folder
#   on disk, with or without Git, then keep the folder here or move it to its
#   planned directory.
new_repository_from_folder = []

# Measure Sizes Again: Measure what every clone takes on disk, its worktrees
#   counted.
measure_sizes_again = []

# Pull All Clones: Fetch every clone and fast-forward those origin has moved
#   past.
pull_all_clones = "alt+p"

# View Starred Repositories…: The repositories you starred on GitHub.
view_starred_repositories = []

# Pull All Favourites: Fetch the starred clones and fast-forward those origin
#   has moved past.
pull_all_favourites = []

# View Options…: What the list shows: server, visibility, grouping,
#   favourites first, cloned only, and which columns.
view_options = "v"

# Toggle Grouping: Group the repositories under their groups.
toggle_grouping = "ctrl+g"

# Filter by Tags…: Show only the repositories wearing the tags you choose.
filter_by_tags = "f"

# Clear Tag Filter: Show the repositories of every tag again.
clear_tag_filter = "F"

# Sort By…: Choose an order for this list, including directory visits in
#   Repositories and Worktrees.
sort_by = "o"

# Toggle Cloned Only: Show only the repositories on disk.
toggle_cloned_only = "L"

# Hidden Repositories…: See what x hid from the lists and bring any of it
