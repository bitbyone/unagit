# Squash Commits…: Make one commit of the commits marked with space, next to
#   each other.
squash_commits = "s"

# New Branch Here…: Start a branch at this commit.
new_branch_here = "n"

# New Worktree Here…: Start a branch at this commit in a worktree of its
#   own.
new_worktree_here = "ctrl+w"

# New Tag…: Put a tag on this commit.
new_tag = "t"

# Tags…: The tags on this commit.
tags = "T"

# Show Pipelines…: The pipelines that ran for this commit, and their jobs.
show_pipelines = "J"

# Open in Browser: The commit's page on the forge.
open_in_browser = "w"

# Copy…: Copy the commit's id, link or reference.
copy = "y"

# Review From Here: Narrow the review to this commit and the ones after it.
review_from_here = "ctrl+r"

# Review From Here In…: The same, opened in an editor you choose.
review_from_here_in = "alt+r"

# A repository's branches, opened from Repositories; the Branches tab of
#   unagit -s.
[branches]

# New Branch…: Start a branch of your own from this one.
new_branch = "n"

# New Worktree: Check the branch out in a directory of its own beside the
#   clone.
new_worktree = "ctrl+w"

# New Merge Request…: Propose this branch for merging, on the server.
new_merge_request = "m"

# Delete Locally…: Delete the branch in the clone, and the worktree it is
#   out in.
delete_locally = "d"

# Delete Everywhere…: Delete the branch in the clone, the worktree it is out
#   in, and on origin.
delete_everywhere = "D"

# Rewrite History…: What was done to the repository's branches.
rewrite_history = "H"

# Delete on Origin…: Delete the branch on origin.
delete_on_origin = "alt+d"

# Activity (4): the watches, the agents, the editors open, and the log.
[activity]

# Refresh All: Ask the servers about every watch, and herdr about every agent,
#   now.
refresh_all = "R"

# Show Log: The log in front, over the screen.
show_log = "z"

# Show Local History: Show in the log only what was done to the branches here.
toggle_local_history = "H"

# Go to List: Move to the list of the watches and the agents.
go_to_list = "a"

# Go to Open Editors: Move to the cards of the editors open.
go_to_open_editors = "e"

# Go to Detail: Move into the detail of the row under the cursor, to read its
#   whole story.
go_to_detail = "d"

# Go to Log: Move into the log: a row of it chooses its thing in the list.
go_to_log = "L"

# Stop Watching All…: Let every watch go, after asking.
stop_watching_all = []

# Running Agents…: Go to a coding agent at work, the ones waiting for an
#   answer first.
running_agents = "alt+a"

# Filter: Narrow the list by typing.
filter = "/"

# Go to Repositories: Every repository of the servers and groups you picked.
go_to_repositories = "1"

# Go to Merge Requests: The open merge requests of those repositories.
go_to_merge_requests = "2"

# Go to Worktrees: Every worktree on disk, plain and grouped.
go_to_worktrees = "3"

# Go to Activity: What runs in the background and waits for you.
go_to_activity = "4"

# Go to Sandboxes: unibox's sandboxes, the tasks agents work on in them, the
#   envs they are made from.
go_to_sandboxes = "5"

# Go to Settings: Servers, groups, tags, integrations and security.
go_to_settings = "S"

# Help: Every key of every screen, the ones that work here lit.
help = "?"

# Quit: Leave unagit. Window editors it opened stay open.
quit = "q"

# Open: Open the agent's directory in your default editor, here.
open = "ctrl+o"

# Open With…: Choose the editor, then open the agent's directory here.
open_with = "alt+o"

# Close Agent…: End the agent in herdr.
close_agent = "x"

# Stop Watching: Let the watch go: its row leaves the list, its mark the other
#   lists.
stop_watching = "x"

# Open Pipeline in Browser: The pipeline's page on the forge.
open_pipeline_in_browser = "w"

# Go to Merge Request: Switch to Merge requests with the cursor on the merge
#   request watched.
go_to_merge_request = "m"

# Refresh: Ask the server about this watch now, rather than at its next turn.
refresh = "r"

# Go to Repository: Switch to Repositories with the cursor on the repository
#   of the branch watched.
go_to_repository = "m"

# Sandboxes (5): unibox's environments, sandboxes and tasks.
[sandboxes]

# New Task…: Start an agent on a new task in this env's sandbox.
new_task = "n"

# Create Sandbox…: Create the env's sandbox, web, without a task in it.
create_sandbox = "c"

# Values…: What the env asks of you.
values = "V"

# Tokens…: The tokens the env's sandboxes use and whether sbx has each.
tokens = "K"

# Ports…: The env's ports, the team's and yours, whether its sandbox is made
#   or not.
ports = "p"

# Repository Index…: The repositories the env's tasks are given by name.
repository_index = "i"

# Use as Unibox Context: Make this env's sandbox the one unibox commands.
use_as_unibox_context = "u"

# Make Default Env: Make this the env a sandbox is created from when none is
#   named.
make_default_env = []

# Open Env Files: Open the team's repository the env's sbxenv files are in, in
#   the default editor.
open = ["ctrl+o", "O"]

# Open Env Files With…: Choose the editor, then open the repository the
#   env's sbxenv files are in there.
open_with = "alt+o"

# Update Env Files: Fast-forward the repository the env's files are in.
update_env_files = []

# Forget Env…: Take the env out of unibox's list.
forget_env = []

# Open Shell…: A shell in the sandbox.
open_shell = "s"

# Network…: The hosts the sandbox may reach beyond its env's, and those it
#   was refused lately.
network = "f"

# Resources…: The CPUs and memory of this sandbox alone, over the env's.
resources = "M"

# Stop Sandbox: Stop the VM; its disk and its tasks stay, and the next session
#   starts it again.
stop_sandbox = "x"

# Recreate Sandbox…: Make the sandbox again from its env as it is now,
#   keeping its tasks.
recreate_sandbox = "C"

# Copy Inspect Command: Put unibox sandbox inspect with the sandbox on the
#   clipboard.
copy_inspect_command = []

# Remove Sandbox…: Remove the VM and every task in it.
remove_sandbox = "d"

# Resume…: Run the task's own agent again, Claude Code, on its last
#   conversation.
resume = "o"

# Resume with Agent…: Run the task with another agent its sandbox has.
resume_with_agent = "a"

# Start Afresh…: Run the task's agent on a new conversation rather than its
#   last one.
start_afresh = []

# Open Shell in Task…: A shell in the task's directory in the sandbox,
#   beside its agent.
open_shell_in_task = "s"

# Show Instructions: What the task's agent reads when a session starts.
show_instructions = "i"

# Add Repository…: Give the task one more repository of yours.
add_repository = "+"

# Rename Task…: Give the task a name taken wherever its ID is.
rename_task = "ctrl+e"

# Copy Resume Command: Put unibox resume with the task on the clipboard, to go
#   on with it from another terminal.
copy_resume_command = "y"

# Open Repository in Browser: The forge's page of the task's first repository,
#   where what its agent pushes arrives.
open_repository_in_browser = "w"

# Remove Task…: Take the task out of the sandbox.
remove_task = "d"

# Resume with Claude Code…: Run Claude Code in the task, in the sandbox.
resume_with_claude_code = []

# Set Up Unibox…: What a first sandbox needs.
set_up_unibox = "I"

# Refresh All: Read the sandboxes, their tasks, the envs and the environment
#   from Unibox again.
refresh_all = "R"

# Go to Sandbox Cards: Move to the cards of the sandboxes.
go_to_sandbox_cards = "B"

# Go to Tasks: Move to the tasks of every sandbox, where agents are resumed.
go_to_tasks = "t"

# Go to Envs: Move to the envs: the team's sbxenv files, each one's sandbox,
#   values and tokens.
go_to_envs = "N"

# Go to Log: Move to the log of what was asked of unibox and what it said.
go_to_log = "L"

# Go to Environment: Move to the environment.
go_to_environment = "e"

# Run Unibox Doctor: Check sbx, every env, your values and tokens and the
#   sandboxes, each with the command that fixes it.
run_unibox_doctor = "D"

# Sandbox Tokens in unagit…: The tokens unagit keeps for the sandboxes and
#   hands to sbx while it runs unlocked.
sandbox_tokens_in_unagit = "T"

# Your Unibox Configuration…: Everything you said to Unibox, beside the
#   teams' files, in one list.
your_unibox_configuration = "Y"

# Unibox Settings…: unibox's own configuration.
unibox_settings = "U"

# Prune Unibox…: Forget the sandboxes sbx no longer has, and unmount what no
#   task uses.
prune_unibox = []

# Install herdr Plugin: Have herdr show the state of sandboxed agents.
install_herdr_plugin = []

# Uninstall herdr Plugin: Take unibox's plugin out of herdr, and its
#   background observer with it.
uninstall_herdr_plugin = []

# Filter: Narrow the list by typing.
filter = "/"

# Go to Repositories: Every repository of the servers and groups you picked.
go_to_repositories = "1"

# Go to Merge Requests: The open merge requests of those repositories.
go_to_merge_requests = "2"

# Go to Worktrees: Every worktree on disk, plain and grouped.
go_to_worktrees = "3"

# Go to Activity: What runs in the background and waits for you.
go_to_activity = "4"

# Go to Sandboxes: unibox's sandboxes, the tasks agents work on in them, the
#   envs they are made from.
go_to_sandboxes = "5"

# Go to Settings: Servers, groups, tags, integrations and security.
go_to_settings = "S"

# Help: Every key of every screen, the ones that work here lit.
help = "?"

# Quit: Leave unagit. Window editors it opened stay open.
quit = "q"
