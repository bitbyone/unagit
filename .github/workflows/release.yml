# A vX.Y tag on a commit of main releases it: the commit's tests must have
# passed, the binary is built and asked for its version, and the Homebrew
# formula in this repository is pointed at the tag and its commit and pushed
# to main, where `brew upgrade` finds it. Homebrew builds from source;
# nothing compiled is published.
#
# The tests are not run again: they ran when the commit was pushed to main
# (test.yml), and running them twice only gives a flaky one a second chance
# to stop the release. A failure there is re-run there, then this release is
# re-run; the tag never moves.
#
# Only the last job may write, and it runs nothing of the repository's: it
# edits one file and pushes. The build, which runs its code and that of its
# dependencies, never holds a token that can write.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+"]

permissions: {}

# Two tags pushed together would race for main; one at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for the tests of the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Tagged right after the push, its tests are still running: wait.
          for attempt in $(seq 1 80); do
            run=$(gh run list --repo "$REPO" --workflow test.yml --commit "$SHA" --branch main \
              --limit 1 --json databaseId,status,conclusion,url \
              --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion) \(.url)"')
            read -r id status conclusion url <<<"$run"
            if [ -z "$id" ]; then
              echo "no test run of $SHA on main yet"
            elif [ "$status" != "completed" ]; then
              echo "the tests of $SHA are $status: $url"
            elif [ "$conclusion" = "success" ]; then
              echo "the tests of $SHA passed: $url"
              exit 0
            else
              echo "::error::the tests of $SHA ended $conclusion - re-run them ($url), then re-run this release"
              exit 1
            fi
            sleep 30
          done
          echo "::error::the tests of $SHA did not finish in 40 minutes"
          exit 1

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and ask for the version
        run: |
          version=${GITHUB_REF_NAME#v}
          make build VERSION="$version"
          got=$(./unagit --version)
          if [ "$got" != "$version" ]; then
            echo "::error::unagit --version printed $got, not $version"
            exit 1
          fi

  formula:
    needs: [tested, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Empty until branch protection needs it; then a deploy key allowed
          # to push to main, and the token is not used for the push.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Point the formula at the tag
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            perl -pi -e 's/(tag:\s+)"v[0-9.]+"/$1"$ENV{TAG}"/; s/(revision:\s+)"[0-9a-f]{40}"/$1"$ENV{SHA}"/' \
              Formula/unagit.rb
            # A replacement that matched nothing would push the old release
            # as the new one.
            grep -q "tag: *\"$TAG\"" Formula/unagit.rb
            grep -q "revision: *\"$SHA\"" Formula/unagit.rb
            if git diff --quiet; then
              echo "the formula already names $TAG"
              exit 0
            fi
            git commit -am "Release unagit ${TAG#v}" \
              -m "Point the Homebrew formula at $TAG, commit $SHA, so brew builds that commit and nothing else."
            # main may have moved during the tests; fetch and try again.
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::could not push the formula to main"
          exit 1
