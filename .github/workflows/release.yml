# A vX.Y tag on a commit of main releases it: the commit's tests must have
# passed, the binary is built and asked for its version, the Windows
# archives are published as the tag's GitHub release (`make dist`), and the
# Homebrew formula and the Scoop manifest in this repository are pointed at
# it and pushed to main, where `brew upgrade` and `scoop update` find them.
# Homebrew builds the tagged commit from source - only a build with a C
# compiler has the keychain - so what is published compiled is Windows'
# alone, and Scoop installs it checked against its SHA-256.
#
# The tests are not run again: they ran when the commit was pushed to main
# (test.yml), and running them twice only gives a flaky one a second chance
# to stop the release. A failure there is re-run there, then this release is
# re-run; the tag never moves.
#
# Only the last two jobs may write, and they run nothing of the
# repository's: one publishes the archives the build left, the other edits
# two files and pushes. The build, which runs its code and that of its
# dependencies, never holds a token that can write.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+"]

permissions: {}

# Two tags pushed together would race for main; one at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for the tests of the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Tagged right after the push, its tests are still running: wait.
          for attempt in $(seq 1 80); do
            run=$(gh run list --repo "$REPO" --workflow test.yml --commit "$SHA" --branch main \
              --limit 1 --json databaseId,status,conclusion,url \
              --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion) \(.url)"')
            read -r id status conclusion url <<<"$run"
            if [ -z "$id" ]; then
              echo "no test run of $SHA on main yet"
            elif [ "$status" != "completed" ]; then
              echo "the tests of $SHA are $status: $url"
            elif [ "$conclusion" = "success" ]; then
              echo "the tests of $SHA passed: $url"
              exit 0
            else
              echo "::error::the tests of $SHA ended $conclusion - re-run them ($url), then re-run this release"
              exit 1
            fi
            sleep 30
          done
          echo "::error::the tests of $SHA did not finish in 40 minutes"
          exit 1

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and ask for the version
        run: |
          version=${GITHUB_REF_NAME#v}
          make build VERSION="$version"
          got=$(./unagit --version)
          if [ "$got" != "$version" ]; then
            echo "::error::unagit --version printed $got, not $version"
            exit 1
          fi
      - name: Build the archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [tested, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run finds the release made and replaces its archives.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag \
              --title "unagit ${TAG#v}" --generate-notes
          fi

  formula:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Empty until branch protection needs it; then a deploy key allowed
          # to push to main, and the token is not used for the push.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Point the formula and the Scoop manifest at the tag
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SUMS: ${{ runner.temp }}/dist/checksums.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            perl -pi -e 's/(tag:\s+)"v[0-9.]+"/$1"$ENV{TAG}"/; s/(revision:\s+)"[0-9a-f]{40}"/$1"$ENV{SHA}"/' \
              Formula/unagit.rb
            # A replacement that matched nothing would push the old release
            # as the new one.
            grep -q "tag: *\"$TAG\"" Formula/unagit.rb
            grep -q "revision: *\"$SHA\"" Formula/unagit.rb
            # The manifest is written whole, from the sums of the archives
            # just published; a missing sum stops the release.
            version=${TAG#v}
            url="https://github.com/$REPO/releases/download/$TAG"
            sum() { awk -v f="unagit_${version}_$1" '$2 == f { print $1 }' "$SUMS" | grep .; }
            amd64=$(sum windows_amd64.zip)
            arm64=$(sum windows_arm64.zip)
            mkdir -p bucket
            jq -n --arg v "$version" --arg url "$url" --arg repo "$REPO" \
              --arg amd64 "$amd64" --arg arm64 "$arm64" '{
                version: $v,
                description: "Universal Navigator Around GIT: repositories, worktrees and merge request reviews",
                homepage: "https://github.com/\($repo)",
                license: "MIT",
                architecture: {
                  "64bit": {url: "\($url)/unagit_\($v)_windows_amd64.zip", hash: $amd64},
                  arm64: {url: "\($url)/unagit_\($v)_windows_arm64.zip", hash: $arm64}
                },
                bin: "unagit.exe",
                checkver: {github: "https://github.com/\($repo)"},
                autoupdate: {architecture: {
                  "64bit": {url: "https://github.com/\($repo)/releases/download/v$version/unagit_$version_windows_amd64.zip"},
                  arm64: {url: "https://github.com/\($repo)/releases/download/v$version/unagit_$version_windows_arm64.zip"}
                }}
              }' > bucket/unagit.json
            git add Formula/unagit.rb bucket/unagit.json
            if git diff --cached --quiet; then
              echo "the formula and the manifest already name $TAG"
              exit 0
            fi
            git commit -m "Release unagit ${TAG#v}" \
              -m "Point the Homebrew formula at $TAG, commit $SHA, so brew builds that commit and nothing else, and the Scoop manifest at its Windows archives."
            # main may have moved during the tests; fetch and try again.
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::could not push the formula and the manifest to main"
          exit 1
